name: build-windows-azure

on:
  workflow_dispatch:
  push:
    branches:
      - azure-direct-upload

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-js

      - name: Create minimal .env in root
        shell: bash
        run: |
          cat > .env <<'EOF'
          appVersion=0.4.84-azure
          VITE_ENVIRONMENT=production
          VITE_SERVER_URL=https://cap.so
          NEXT_PUBLIC_WEB_URL=https://cap.so
          NEXTAUTH_URL=https://cap.so
          RUST_TARGET_TRIPLE=x86_64-pc-windows-msvc
          EOF

      - name: Build app (release)
        working-directory: apps/desktop
        shell: pwsh
        env:
          CI: false
        run: |
          pnpm -w cap-setup
          pnpm build:tauri --target x86_64-pc-windows-msvc --config src-tauri/tauri.prod.conf.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: cap-azure-windows-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: cap-azure-windows-msi
          path: target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
